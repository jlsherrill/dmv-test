<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMV Practice Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .quiz-container {
            padding: 30px;
        }

        .question-counter {
            background-color: #ecf0f1;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .question {
            font-size: 18px;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
            border-radius: 5px;
        }

        .options {
            margin-bottom: 30px;
        }

        .option {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            background-color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .option:hover {
            border-color: #3498db;
            background-color: #f8f9fa;
        }

        .option.selected {
            border-color: #3498db;
            background-color: #e3f2fd;
        }

        .next-btn {
            background-color: #3498db;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
            display: block;
            margin: 0 auto;
        }

        .next-btn:hover {
            background-color: #2980b9;
        }

        .next-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .results {
            text-align: center;
            padding: 30px;
        }

        .score {
            font-size: 24px;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        .score.pass {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .score.fail {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .incorrect-answers {
            text-align: left;
            margin-top: 30px;
        }

        .incorrect-question {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 5px;
        }

        .incorrect-question h4 {
            color: #856404;
            margin-bottom: 10px;
        }

        .correct-answer {
            color: #155724;
            font-weight: bold;
        }

        .your-answer {
            color: #721c24;
            font-weight: bold;
        }

        .restart-btn {
            background-color: #27ae60;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .restart-btn:hover {
            background-color: #219a52;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DMV Practice Quiz</h1>
            <p>Test your knowledge with 25 random questions</p>
        </div>

        <div id="loading" class="loading">
            Loading questions...
        </div>

        <div id="quiz-container" class="quiz-container hidden">
            <div class="question-counter">
                Question <span id="current-question">1</span> of 25
            </div>
            
            <div class="question" id="question-text">
                Question will appear here
            </div>
            
            <div class="options" id="options-container">
                <!-- Options will be generated here -->
            </div>
            
            <button id="next-btn" class="next-btn" disabled>Next Question</button>
        </div>

        <div id="results-container" class="results hidden">
            <div id="score-display" class="score">
                <!-- Score will be displayed here -->
            </div>
            
            <div id="incorrect-answers" class="incorrect-answers">
                <!-- Incorrect answers will be shown here -->
            </div>
            
            <button id="restart-btn" class="restart-btn">Take Quiz Again</button>
        </div>
    </div>

    <script>
        class DMVQuiz {
            constructor() {
                this.questions = [];
                this.currentQuestionIndex = 0;
                this.selectedQuestions = [];
                this.userAnswers = [];
                this.score = 0;
                this.init();
            }

            async init() {
                try {
                    await this.loadQuestions();
                    this.setupQuiz();
                    this.bindEvents();
                    this.showQuestion();
                } catch (error) {
                    console.error('Error initializing quiz:', error);
                    document.getElementById('loading').textContent = 'Error loading quiz. Please refresh the page.';
                }
            }

            async loadQuestions() {
                const response = await fetch('questions_answers.json');
                if (!response.ok) {
                    throw new Error('Failed to load questions');
                }
                this.questions = await response.json();
            }

            setupQuiz() {
                // Select 25 random questions
                const shuffled = [...this.questions].sort(() => Math.random() - 0.5);
                this.selectedQuestions = shuffled.slice(0, 25);
                this.userAnswers = new Array(25).fill(null);
                
                // Hide loading and show quiz
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('quiz-container').classList.remove('hidden');
            }

            bindEvents() {
                document.getElementById('next-btn').addEventListener('click', () => {
                    this.nextQuestion();
                });

                document.getElementById('restart-btn').addEventListener('click', () => {
                    this.restartQuiz();
                });
            }

            showQuestion() {
                const question = this.selectedQuestions[this.currentQuestionIndex];
                
                // Update question counter
                document.getElementById('current-question').textContent = this.currentQuestionIndex + 1;
                
                // Update question text
                document.getElementById('question-text').textContent = question.question;
                
                // Generate options
                const optionsContainer = document.getElementById('options-container');
                optionsContainer.innerHTML = '';
                
                question.options.forEach((option, index) => {
                    const button = document.createElement('button');
                    button.className = 'option';
                    button.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
                    button.onclick = () => this.selectOption(String.fromCharCode(65 + index), button);
                    optionsContainer.appendChild(button);
                });

                // Reset next button
                document.getElementById('next-btn').disabled = true;
                document.getElementById('next-btn').textContent = 
                    this.currentQuestionIndex === 24 ? 'Finish Quiz' : 'Next Question';
            }

            selectOption(answer, buttonElement) {
                // Remove previous selection
                document.querySelectorAll('.option').forEach(btn => {
                    btn.classList.remove('selected');
                });
                
                // Add selection to clicked button
                buttonElement.classList.add('selected');
                
                // Store user's answer
                this.userAnswers[this.currentQuestionIndex] = answer;
                
                // Enable next button
                document.getElementById('next-btn').disabled = false;
            }

            nextQuestion() {
                if (this.currentQuestionIndex < 24) {
                    this.currentQuestionIndex++;
                    this.showQuestion();
                } else {
                    this.showResults();
                }
            }

            showResults() {
                // Calculate score
                this.score = 0;
                const incorrectAnswers = [];

                for (let i = 0; i < this.selectedQuestions.length; i++) {
                    const question = this.selectedQuestions[i];
                    const userAnswer = this.userAnswers[i];
                    const correctAnswer = question.correct_answer;

                    if (userAnswer === correctAnswer) {
                        this.score++;
                    } else {
                        incorrectAnswers.push({
                            question: question.question,
                            options: question.options,
                            userAnswer: userAnswer,
                            correctAnswer: correctAnswer,
                            questionNumber: i + 1
                        });
                    }
                }

                // Hide quiz container and show results
                document.getElementById('quiz-container').classList.add('hidden');
                document.getElementById('results-container').classList.remove('hidden');

                // Display score
                const scoreDisplay = document.getElementById('score-display');
                const percentage = Math.round((this.score / 25) * 100);
                const isPassing = percentage >= 80;
                
                scoreDisplay.className = `score ${isPassing ? 'pass' : 'fail'}`;
                scoreDisplay.innerHTML = `
                    <h2>Quiz Complete!</h2>
                    <p>Your Score: ${this.score}/25 (${percentage}%)</p>
                    <p>${isPassing ? 'Congratulations! You passed!' : 'You need 80% to pass. Keep studying!'}</p>
                `;

                // Display incorrect answers
                const incorrectContainer = document.getElementById('incorrect-answers');
                if (incorrectAnswers.length > 0) {
                    incorrectContainer.innerHTML = '<h3>Questions You Got Wrong:</h3>';
                    
                    incorrectAnswers.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'incorrect-question';
                        
                        const userAnswerText = item.userAnswer ? 
                            item.options[item.userAnswer.charCodeAt(0) - 65] : 'No answer selected';
                        const correctAnswerText = item.options[item.correctAnswer.charCodeAt(0) - 65];
                        
                        div.innerHTML = `
                            <h4>Question ${item.questionNumber}: ${item.question}</h4>
                            <p><span class="your-answer">Your answer:</span> ${item.userAnswer ? item.userAnswer + '. ' : ''}${userAnswerText}</p>
                            <p><span class="correct-answer">Correct answer:</span> ${item.correctAnswer}. ${correctAnswerText}</p>
			    <details style="margin-top: 10px;">
			      <summary style="cursor: pointer; color: #2c3e50; font-weight: bold;">All answers</summary>
			      <ol type="A" style="padding: 10px; margin-top: 5px;">
			      <li>
			      ${item.options.join("</li><li>")}
			      </li>
			      </ol>
			    </details>
                        `;
                        incorrectContainer.appendChild(div);
                    });
                } else {
                    incorrectContainer.innerHTML = '<h3>Perfect! You got all questions correct!</h3>';
                }
            }

            restartQuiz() {
                // Reset quiz state
                this.currentQuestionIndex = 0;
                this.selectedQuestions = [];
                this.userAnswers = [];
                this.score = 0;

                // Hide results and show quiz
                document.getElementById('results-container').classList.add('hidden');
                document.getElementById('quiz-container').classList.remove('hidden');

                // Setup new quiz
                this.setupQuiz();
                this.showQuestion();
            }
        }

        // Initialize the quiz when the page loads
        window.addEventListener('DOMContentLoaded', () => {
            new DMVQuiz();
        });
    </script>
</body>
</html>
